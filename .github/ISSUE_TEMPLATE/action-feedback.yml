name: Dashboard action feedback
description: Rate or improve an AI-suggested dashboard action
title: "[Dashboard action feedback] "
labels:
  - dashboard-feedback
body:
  - type: dropdown
    id: rating
    attributes:
      label: Rating
      options:
        - Helpful
        - Not helpful
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Target issue or PR
      description: Include the PowerToys issue/PR number or URL.
      placeholder: "PR 12345"
    validations:
      required: true
  - type: input
    id: action
    attributes:
      label: Suggested action
      placeholder: "Post review comments"
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: Feedback
      description: What was useful, incorrect, incomplete, or unsafe?
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Public-data confirmation
      options:
        - label: I did not include credentials, private notes, or confidential data.
          required: true

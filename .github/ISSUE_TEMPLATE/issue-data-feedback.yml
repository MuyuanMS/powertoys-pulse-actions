name: Issue data feedback
description: Report incorrect, stale, or incomplete issue data shown by Pulse
title: "[Issue data feedback] "
labels:
  - issue-data-feedback
body:
  - type: input
    id: target
    attributes:
      label: Target issue
      description: Include the PowerToys issue number or URL.
      placeholder: "Issue 12345"
    validations:
      required: true
  - type: dropdown
    id: problem
    attributes:
      label: Data problem
      options:
        - Incorrect title or link
        - Incorrect status or timestamps
        - Incorrect labels or utility
        - Missing issue or duplicate issue
        - Other
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: What should be corrected?
      description: Describe the discrepancy and, if possible, link to the authoritative GitHub data.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public-data confirmation
      options:
        - label: I did not include credentials, private notes, or confidential data.
          required: true

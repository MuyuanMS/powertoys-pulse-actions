name: Refresh dashboard action data

on:
  schedule:
    # Finish before Pulse's 06:00 and 18:00 UTC refreshes.
    - cron: "30 5,17 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Inventory is read-only; refresh requires DASHBOARD_READ_TOKEN"
        required: true
        default: "inventory"
        type: choice
        options:
          - inventory
          - refresh

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dashboard-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: windows-latest
    timeout-minutes: 55

    steps:
      - name: Checkout canonical action repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Collect read-only automation inventory
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\Get-DashboardAutomationInventory.ps1

      - name: Upload inventory report
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-automation-inventory
          path: automation-output/dashboard-inventory.json
          retention-days: 14

      - name: Require full-refresh credential
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'refresh'
        shell: pwsh
        env:
          DASHBOARD_READ_TOKEN: ${{ secrets.DASHBOARD_READ_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DASHBOARD_READ_TOKEN)) {
            throw @'
          DASHBOARD_READ_TOKEN is required for a full refresh because the
          repository GITHUB_TOKEN cannot reliably enumerate the complete
          cross-organization PowerToys issue history. Configure a fine-grained
          read token, then dispatch the workflow in refresh mode.
          '@
          }

      - name: Refresh and validate public artifacts
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'refresh'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.DASHBOARD_READ_TOKEN }}
        run: .\Invoke-DashboardRefresh.ps1

      - name: Publish refresh branch
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'refresh'
        id: publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $changes = @(git status --short -- data)
          if ($changes.Count -eq 0) {
            "changed=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $branch = 'automation/dashboard-data-refresh'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B $branch
          git add data
          git diff --cached --check
          git commit -m 'Refresh PowerToys dashboard action data'
          git push --force origin "HEAD:refs/heads/$branch"
          "changed=true" >> $env:GITHUB_OUTPUT

          $existing = gh pr list `
            --repo $env:GITHUB_REPOSITORY `
            --head $branch `
            --state open `
            --json number `
            --jq '.[0].number'
          if (-not $existing) {
            $body = @(
              'Automated deterministic refresh of the public PowerToys Pulse action feed.'
              ''
              'This workflow:'
              '- inventories the live public PowerToys backlog;'
              '- preserves existing reviewed/triaged artifacts;'
              '- sanitizes public output;'
              '- validates the complete artifact and skill contracts;'
              '- does not post or modify anything in `microsoft/PowerToys`.'
            ) -join "`n"
            gh pr create `
              --repo $env:GITHUB_REPOSITORY `
              --base main `
              --head $branch `
              --title 'Refresh PowerToys dashboard action data' `
              --body $body
          }

      - name: Summarize unchanged refresh
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'refresh' && steps.publish.outputs.changed == 'false'
        shell: pwsh
        run: '"No dashboard data changes were detected." >> $env:GITHUB_STEP_SUMMARY'
